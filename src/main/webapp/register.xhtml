<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
  <h:head>
    <title>Регистрация • LabWork</title>
    <h:outputStylesheet library="app" name="app.css"/>
  </h:head>
  <h:body>
    <main class="login">
      <div class="card login-card">
        <h1 class="login-title">Registration</h1>
        <p>Создайте учётную запись для входа в систему.</p>

        <h:form>
          <p:messages/>

          <p:outputLabel for="user" value="Логин"/>
          <p:inputText id="user" value="#{register.username}" required="true"
                       maxlength="100"
                       requiredMessage="Введите логин"/>

          <p:outputLabel for="password" value="Пароль"/>
          <p:password id="password" value="#{register.password}" required="true"
                      maxlength="100"
                      requiredMessage="Введите пароль"/>

          <p:outputLabel for="confirm" value="Повторите пароль"/>
          <p:password id="confirm" value="#{register.confirm}" required="true"
                      maxlength="100"
                      requiredMessage="Повторите пароль"/>

          <p:commandButton value="Зарегистрироваться" action="#{register.submit}" update="@form" styleClass="wide"/>
          <p class="hint">Уже есть аккаунт? <h:link outcome="/login" value="Войти"/></p>
        </h:form>
      </div>
    </main>
  </h:body>
</html>
